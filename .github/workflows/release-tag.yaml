name: release-tag-installer

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Extract and Store Trimmed Repository Name
        run: |
          REPO_CHART_NAME="${{ github.repository }}"
          REPO_APP_NAME=$(echo "$REPO_CHART_NAME" | sed 's/-chart-test$//')  # Remove "-chart-test" suffix if present
          
          # Check if the trimmed repo exists
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO_APP_NAME")

          if [[ "$HTTP_STATUS" -eq 200 ]]; then
            echo "Using trimmed repository name: $REPO_APP_NAME"
            echo "REPO_APP_NAME=$REPO_APP_NAME" >> $GITHUB_ENV
          else
            echo "Trimmed repository not found. Falling back to original repository name."
            echo "REPO_APP_NAME=$REPO_CHART_NAME" >> $GITHUB_ENV
          fi

      - name: Use the Stored Variable
        run: |
          echo "Trimmed Repository Name: ${{ env.REPO_APP_NAME }}"

      - name: Authenticate with GitHub App
        id: authenticate
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: Extract App Version
        run: |
          set -euo pipefail
          
          # Fetch tags to ensure we have the complete history
          git fetch --tags --force

          echo "=== Searching latest tags for module '${{ env.MODULE }}' ==="
          
          # Find the latest tag matching the module pattern (e.g. installer/*)
          # We use '|| true' to prevent failure if no tags are found
          APP_VERSION="$(
            git tag -l '${{ env.MODULE }}/*' --sort=-version:refname \
            | head -n1 || true
          )"
          echo "Raw APP_VERSION tag: '${APP_VERSION}'"

          echo
          echo "=== Processing APP_VERSION ==="
          
          # Apply fallback if variable is empty
          APP_VERSION="${APP_VERSION:-${{ env.MODULE }}/0.0.1}"
          echo "After fallback → '${APP_VERSION}'"

          # Strip prefix: remove everything before the last slash
          # Example: 'installer/0.6.3' becomes '0.6.3'
          APP_VERSION="${APP_VERSION##*/}"
          echo "After strip (Final) → '${APP_VERSION}'"

          # Export to GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v3

      - name: Print Version
        run: |
          echo APP_VERSION:${{steps.app_version.outputs.tag}}
          echo CHART_VERSION:${{ github.ref_name }}

      - name: Replace CHART_VERSION in chart/Chart.yaml
        run: sed -i 's/CHART_VERSION/${{ github.ref_name }}/g' ./chart/Chart.yaml

      - name: Print latest App Version
        run: echo ${{ steps.app_version.outputs.tag }}

      - name: Replace APP_VERSION in Chart.yaml
        run: sed -i 's/APP_VERSION/${{ env.APP_VERSION }}/g' ./chart/Chart.yaml

      - name: Replace CHART_VERSION in ./${{ env.MODULE }}-pre-upgrade-chart/Chart.yaml
        run: sed -i 's/CHART_VERSION/${{ github.ref_name }}/g' ./${{ env.MODULE }}-pre-upgrade-chart/Chart.yaml

      # Stage only the chart you want to publish
      - name: Prepare charts_dir
        run: |
          mkdir -p _${{ env.MODULE }}-chart
          cp -R ${{ env.MODULE }}-chart _${{ env.MODULE }}-chart/
          cp -R ${{ env.MODULE }}-pre-upgrade-chart _${{ env.MODULE }}-chart/

      - name: Publish Helm chart
        uses: stefanprodan/helm-gh-pages@master
        with:
          token: ${{ steps.authenticate.outputs.token }}
          charts_dir: _chart
          charts_url: https://charts.krateo.io
          owner: krateoplatformops
          repository: helm-charts
          branch: gh-pages